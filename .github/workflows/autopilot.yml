# Jua Kesho autopilot — runs in the cloud so nothing depends on one laptop.
#   Sunday 17:00 EAT : plan + draft + check + render next week, send previews to Telegram
#   Daily 09:00 EAT  : one "hot" post on the day's biggest Kenyan story, out the same evening
#   Every 2 hours    : collect ✅/❌ taps from Telegram, publish what is approved and due
# Secrets (repo Settings → Secrets and variables → Actions): see automation/.env.example
name: autopilot

on:
  schedule:
    - cron: "0 14 * * 0"      # Sunday 14:00 UTC = 17:00 EAT
    - cron: "20 */2 * * *"    # every 2 hours
    - cron: "5 6 * * *"       # daily 06:05 UTC = 09:05 EAT: the lunchtime news post
    - cron: "5 13 * * *"      # daily 13:05 UTC = 16:05 EAT: the evening news post (a different story)
    - cron: "35 3 * * *"      # daily 03:35 UTC = 06:35 EAT: the morning news post
    - cron: "40 5-17/2 * * *" # every 2 h, 08:40-20:40 EAT: a breaking post, only when several newsrooms report a new story
    - cron: "10 14 * * 3"     # Wednesday 17:10 EAT: write Friday-Sunday close to their slots (backup to the listener)
  workflow_dispatch:
    inputs:
      command:
        description: "week (next week) | hot (today's post on the biggest story) | this-week (draft the current week now) | tick | learn | redo (re-draft posts held back) | remake (re-drafts this week's unapproved posts from scratch and sends them again) | renew (redrafts NEXT week under the current rules, approved posts included, and sends them again) | rephoto (same words, new photos, re-sent) | clips (turns videos you sent the bot into Tazama Hii Reels now) | radar (sends live X trends + most-watched Kenyan clips to Telegram) | photocheck (explains this week's photo searches in state/photos.log) | samples (sends the newest features to Telegram to review) | tracker (next week as a Development Tracker batch: done, stalled, ignored, money diverted; sent now) | rehearse (no keys needed: renders a mock week, posts nothing)"
        default: "tick"

concurrency:
  group: autopilot          # never run two at once (state lives in the repo)
  cancel-in-progress: false

permissions:
  contents: write           # commit renders and state back

jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 120   # Sunday renders include ~12 Reels
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # the free writer (Gemini free tier, aistudio.google.com/apikey)
      JUA_GEMINI_MODEL: ${{ vars.JUA_GEMINI_MODEL }}
      JUA_PROVIDER: ${{ vars.JUA_PROVIDER }}               # empty = Gemini if its key is set, else Claude; or force "gemini" / "anthropic"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # optional
      JUA_MODEL: ${{ vars.JUA_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # optional: real photos
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}   # optional: real video footage (pixabay.com/api/docs)
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      # GitHub Pages serves images/videos with correct content types (enable Pages: Settings → Pages → main / root)
      PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Pick command
        id: cmd
        run: |
          # Until the Telegram secrets exist, scheduled runs skip quietly instead of failing every 2 hours
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Secrets not set yet: skipping. See automation/.env.example"; echo "c=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "c=${{ inputs.command }}" >> "$GITHUB_OUTPUT";
            echo "base=$(echo '${{ inputs.command }}' | awk '{print $1}')" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "0 14 * * 0" ]; then echo "c=week" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "5 6 * * *" ]; then echo "c=hot" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "5 13 * * *" ]; then echo "c=hot --evening" >> "$GITHUB_OUTPUT"; echo "base=hot" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "35 3 * * *" ]; then echo "c=hot --morning" >> "$GITHUB_OUTPUT"; echo "base=hot" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "40 5-17/2 * * *" ]; then echo "c=hot --breaking" >> "$GITHUB_OUTPUT"; echo "base=hot" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "10 14 * * 3" ]; then echo "c=this-week" >> "$GITHUB_OUTPUT";
          else echo "c=tick" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        if: (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'week' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'hot' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'this-week' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'redo' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'rehearse' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'samples' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'remake' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'renew' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'rephoto' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'clips' || (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'tracker'
        run: |
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true   # video.py falls back to imageio-ffmpeg
          if [ "${{ steps.cmd.outputs.c }}" = "clips" ]; then pip install faster-whisper; fi   # captions from the clip's audio
          # the presenter (only once James has picked a voice): the voice model on CPU; Rhubarb downloads itself
          if (cd automation && python -c "import voicelab,sys; sys.exit(0 if voicelab.chosen() else 1)"); then
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0 \
              && pip install chatterbox-tts soundfile || echo "::warning::voice tools failed to install: Reels stay text-only"
          fi

      - name: Install (light)
        if: (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'week' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'hot' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'this-week' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'redo' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'rehearse' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'samples' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'remake' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'renew' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'rephoto' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'clips' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'tracker' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'skip'
        run: pip install -r automation/requirements.txt

      - name: Tests
        id: tests
        if: steps.cmd.outputs.c != 'skip'
        # a tick only collects taps and publishes what you approved: a failing test must not stop that
        continue-on-error: ${{ steps.cmd.outputs.c == 'tick' }}
        run: |
          cd automation
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee run.log   # a failure shows in "Show why it failed"

      - name: Warn about failing tests
        if: steps.tests.outcome == 'failure' && steps.cmd.outputs.c == 'tick' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ A self-check failed (taps and publishing still ran). New drafts are paused until it's fixed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Rehearse (mock week, dry run)
        if: (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'rehearse'
        run: cd automation && python pipeline.py week --mock --dry-run

      - name: Download the rehearsal
        if: (steps.cmd.outputs.base || steps.cmd.outputs.c) == 'rehearse'
        uses: actions/upload-artifact@v6
        with:
          name: rehearsal-week
          path: exports/20*-W*/
          retention-days: 7

      - name: Run ${{ steps.cmd.outputs.c }}
        if: (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'skip' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'rehearse'
        run: |
          cd automation
          set -o pipefail
          if [ "${{ steps.cmd.outputs.c }}" = "this-week" ]; then
            python pipeline.py week --week "$(python -c 'import pipeline; print(pipeline.current_week_label(ahead=0))')" 2>&1 | tee run.log
          else
            python pipeline.py ${{ steps.cmd.outputs.c }} 2>&1 | tee run.log
          fi

      - name: Clips you sent (Tazama Hii Reels)
        if: steps.cmd.outputs.c == 'tick'
        run: |
          cd automation
          # only when the tick just queued a clip: the heavy tools are installed for that run alone
          python -c "import json,sys; d=json.load(open('state/clips.json')); sys.exit(0 if any(c['status']=='queued' for c in d['clips']) else 1)" 2>/dev/null \
            || { echo "no clips waiting"; exit 0; }
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true
          pip install faster-whisper
          set -o pipefail
          python pipeline.py clipwork 2>&1 | tee -a run.log

      - name: Fresh versions of posts that went stale
        if: steps.cmd.outputs.c == 'tick'
        run: |
          cd automation
          # only when this tick held a written-ahead post because the news moved on: redraft it now
          python -c "import json,glob,sys; sys.exit(0 if any(p['status']=='needs_human' and any(str(e).startswith('outdated:') for e in (p.get('guard') or {}).get('errors', [])) for f in glob.glob('content/weeks/*.json') for p in json.load(open(f))['posts']) else 1)" \
            || { echo "nothing stale"; exit 0; }
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true
          set -o pipefail
          python pipeline.py redo 2>&1 | tee -a run.log

      - name: Photos you sent (swap a post's picture)
        if: steps.cmd.outputs.c == 'tick'
        run: |
          cd automation
          # only when the tick just took a photo you replied to a card with: render and re-send that post
          python -c "import json,glob,sys; sys.exit(0 if any(p['status']=='drafted' and str(p.get('photo','')).startswith('sent:') for f in glob.glob('content/weeks/*.json') for p in json.load(open(f))['posts']) else 1)" \
            || { echo "no photo swaps"; exit 0; }
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true
          set -o pipefail
          python pipeline.py swapwork 2>&1 | tee -a run.log

      - name: Your voice recording (the presenter's voice)
        if: steps.cmd.outputs.c == 'tick'
        run: |
          cd automation
          # only when the tick just saved a new voice note: the voice tools are installed for that run alone
          python voicelab.py pending || { echo "no new voice recording"; exit 0; }
          sudo apt-get install -y ffmpeg || true
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install chatterbox-tts soundfile
          set -o pipefail
          python voicelab.py clone 2>&1 | tee -a run.log

      - name: Show why it failed
        if: failure()
        run: |
          # the last lines of the run as one annotation, readable from the run page and the API
          [ -f automation/run.log ] && echo "::error title=autopilot failed::$(tail -25 automation/run.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')" || true

      - name: Save state and renders
        if: always() && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'skip' && (steps.cmd.outputs.base || steps.cmd.outputs.c) != 'rehearse'
        run: |
          git config user.name "jua-kesho-bot"
          git config user.email "bot@users.noreply.github.com"
          # Add each path only if it exists: one missing pathspec makes git add save nothing at all
          for p in automation/content/weeks automation/state exports; do [ -e "$p" ] && git add -A -- "$p"; done
          # (MP4s and images are committed so GitHub Pages can serve them to Instagram)
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: ${{ steps.cmd.outputs.c }} $(date -u +%FT%TZ)"
          # Someone may have pushed during the run (e.g. an edit on github.com): rebase, then retry
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 10)); done
          echo "::error::could not push state after 3 attempts"; exit 1
