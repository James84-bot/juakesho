# Voice lab: makes presenter voice samples on GitHub's free CPU machines and sends them to Telegram.
# Nothing is posted publicly. Run from Actions → voice → Run workflow.
#   kokoro : ready-made open-source AI voices (accent and speed check)
#   clone  : the presenter's character voices from the newest voice note you sent the bot
name: voice

on:
  workflow_dispatch:
    inputs:
      step:
        description: "kokoro | clone"
        default: "kokoro"

concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get install -y ffmpeg espeak-ng
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          if [ "${{ inputs.step }}" = "kokoro" ]; then pip install "kokoro>=0.9.4" soundfile; else pip install chatterbox-tts soundfile; fi
      - name: Make the samples
        run: |
          cd automation
          nproc
          python voicelab.py ${{ inputs.step }}
      - name: Save which recording the voice was made from
        if: inputs.step == 'clone'
        run: |
          git config user.name "jua-kesho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- automation/state/voice.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "voice: samples made $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i * 10)); done
